<script type="text/babel">
const { useState, useEffect, useRef } = React;
const NOMBRE_NEGOCIO = "El Argentino";
const TAGLINE = "Café · Desayuno · Almuerzo · Parrilla";

// Credenciales de admin — cambiar acá cuando quieras
const ADMIN_USUARIO = "ElArgentino";
const ADMIN_CONTRASENA = "tango2024";

function resizeImagen(file, callback, maxSize = 900) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
      else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function App() {
  const [productos, setProductos] = useState({});
  const [categorias, setCategorias] = useState([]);
  const [config, setConfig] = useState({ whatsapp: '', instagram: '', logo: '', direccion: '' });

  const [categoriaActiva, setCategoriaActiva] = useState('todas');
  const [busqueda, setBusqueda] = useState('');

  const [isAdmin, setIsAdmin] = useState(false);
  const [mostrarAdminModal, setMostrarAdminModal] = useState(false);
  const [adminTab, setAdminTab] = useState('pedidos');
  const [usuario, setUsuario] = useState('');
  const [contrasena, setContrasena] = useState('');
  const [errorLogin, setErrorLogin] = useState('');

  const [form, setForm] = useState({ nombre: '', categoria: '', descripcion: '', precio: '', imagen: '', insumos: [] });
  const [editandoId, setEditandoId] = useState(null);

  const [nuevaCategoria, setNuevaCategoria] = useState('');

  const [whatsappInput, setWhatsappInput] = useState('');
  const [instagramInput, setInstagramInput] = useState('');
  const [direccionInput, setDireccionInput] = useState('');

  const [platoDelDia, setPlatoDelDia] = useState(null);
  const [platoForm, setPlatoForm] = useState({ nombre: '', descripcion: '', precio: '', imagen: '', insumos: [] });

  const [carrito, setCarrito] = useState([]);
  const [mostrarCarrito, setMostrarCarrito] = useState(false);
  const [modoConsumo, setModoConsumo] = useState('mesa');
  const [pedidoForm, setPedidoForm] = useState({ nombre: '', telefono: '', direccion: '', mesa: '' });
  const [enviandoPedido, setEnviandoPedido] = useState(false);

  const [mesas, setMesas] = useState({});
  const [nuevaMesaNumero, setNuevaMesaNumero] = useState('');
  const [mesaPorQR, setMesaPorQR] = useState(null);

  const [pedidos, setPedidos] = useState({});
  const [confirmacionPedido, setConfirmacionPedido] = useState(null);

  const [insumos, setInsumos] = useState({});
  const [insumoForm, setInsumoForm] = useState({ nombre: '', unidad: '', cantidad: '', minimo: '' });
  const [editandoInsumoId, setEditandoInsumoId] = useState(null);
  const [selInsumoProd, setSelInsumoProd] = useState('');
  const [cantInsumoProd, setCantInsumoProd] = useState('');
  const [selInsumoPlato, setSelInsumoPlato] = useState('');
  const [cantInsumoPlato, setCantInsumoPlato] = useState('');

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const mesaUrl = params.get('mesa');
    if (mesaUrl) {
      setMesaPorQR(mesaUrl);
      setModoConsumo('mesa');
      setPedidoForm(f => ({ ...f, mesa: mesaUrl }));
    }
  }, []);

  useEffect(() => {
    db.ref('productos').on('value', s => setProductos(s.val() || {}));
    db.ref('categorias').on('value', s => setCategorias(s.val() || []));
    db.ref('config').on('value', s => {
      const c = s.val() || {};
      setConfig(c);
      setWhatsappInput(c.whatsapp || '');
      setInstagramInput(c.instagram || '');
      setDireccionInput(c.direccion || '');
    });
    db.ref('platoDelDia').on('value', s => {
      const p = s.val();
      setPlatoDelDia(p);
      if (p) setPlatoForm({ nombre: p.nombre || '', descripcion: p.descripcion || '', precio: p.precio ? String(p.precio) : '', imagen: p.imagen || '', insumos: p.insumos || [] });
    });
    db.ref('mesas').on('value', s => setMesas(s.val() || {}));
    db.ref('pedidos').on('value', s => setPedidos(s.val() || {}));
    db.ref('insumos').on('value', s => setInsumos(s.val() || {}));
  }, []);

  const listaProductos = Object.entries(productos).map(([id, p]) => ({ id, ...p }));

  const productosFiltrados = listaProductos.filter(p => {
    const pasaCategoria = categoriaActiva === 'todas' || p.categoria === categoriaActiva;
    const pasaBusqueda = !busqueda || p.nombre.toLowerCase().includes(busqueda.toLowerCase());
    return pasaCategoria && pasaBusqueda;
  });

  const categoriasConProductos = categorias.filter(c => listaProductos.some(p => p.categoria === c));

  function intentarLogin() {
    if (usuario === ADMIN_USUARIO && contrasena === ADMIN_CONTRASENA) {
      setIsAdmin(true);
      setErrorLogin('');
      setUsuario(''); setContrasena('');
    } else {
      setErrorLogin('Usuario o contraseña incorrectos');
    }
  }
  function cerrarSesion() {
    setIsAdmin(false);
    setMostrarAdminModal(false);
  }

  function resetForm() {
    setForm({ nombre: '', categoria: categorias[0] || '', descripcion: '', precio: '', imagen: '', insumos: [] });
    setEditandoId(null);
    setSelInsumoProd(''); setCantInsumoProd('');
  }
  function editarProducto(p) {
    setForm({ nombre: p.nombre, categoria: p.categoria, descripcion: p.descripcion || '', precio: String(p.precio), imagen: p.imagen || '', insumos: p.insumos || [] });
    setEditandoId(p.id);
    setAdminTab('productos');
  }
  function guardarProducto() {
    if (!form.nombre || !form.categoria || !form.precio) return;
    const id = editandoId || db.ref('productos').push().key;
    db.ref('productos/' + id).set({
      nombre: form.nombre,
      categoria: form.categoria,
      descripcion: form.descripcion || '',
      precio: Number(form.precio),
      imagen: form.imagen || '',
      insumos: form.insumos || []
    });
    resetForm();
  }
  function eliminarProducto(id) {
    if (confirm('¿Eliminar este ítem del menú?')) db.ref('productos/' + id).remove();
  }
  function handleImagenProducto(e) {
    const file = e.target.files[0];
    if (!file) return;
    resizeImagen(file, dataUrl => setForm(f => ({ ...f, imagen: dataUrl })));
    e.target.value = '';
  }
  function agregarInsumoAProducto() {
    if (!selInsumoProd || !cantInsumoProd) return;
    setForm(f => ({ ...f, insumos: [...(f.insumos || []), { insumoId: selInsumoProd, cantidad: Number(cantInsumoProd) }] }));
    setSelInsumoProd(''); setCantInsumoProd('');
  }
  function quitarInsumoDeProducto(idx) {
    setForm(f => ({ ...f, insumos: f.insumos.filter((_, i) => i !== idx) }));
  }

  function agregarCategoria() {
    if (!nuevaCategoria || categorias.includes(nuevaCategoria)) return;
    db.ref('categorias').set([...categorias, nuevaCategoria]).then(() => setNuevaCategoria(''));
  }
  function eliminarCategoria(cat) {
    if (listaProductos.some(p => p.categoria === cat)) {
      alert('Esta categoría tiene ítems del menú cargados. Cambiá o eliminá esos ítems antes de borrarla.');
      return;
    }
    db.ref('categorias').set(categorias.filter(c => c !== cat));
  }

  function agregarAlCarrito(p) {
    setCarrito(prev => {
      const existe = prev.find(it => it.id === p.id);
      if (existe) return prev.map(it => it.id === p.id ? { ...it, cantidad: it.cantidad + 1 } : it);
      return [...prev, { id: p.id, nombre: p.nombre, precio: p.precio, cantidad: 1, insumos: p.insumos || [] }];
    });
  }
  function agregarPlatoDelDiaAlCarrito() {
    if (!platoDelDia) return;
    const idPlato = 'plato-del-dia';
    setCarrito(prev => {
      const existe = prev.find(it => it.id === idPlato);
      if (existe) return prev.map(it => it.id === idPlato ? { ...it, cantidad: it.cantidad + 1 } : it);
      return [...prev, { id: idPlato, nombre: platoDelDia.nombre, precio: platoDelDia.precio, cantidad: 1, insumos: platoDelDia.insumos || [] }];
    });
  }
  function cambiarCantidadCarrito(id, delta) {
    setCarrito(prev => prev
      .map(it => it.id === id ? { ...it, cantidad: it.cantidad + delta } : it)
      .filter(it => it.cantidad > 0));
  }
  const totalCarrito = carrito.reduce((a, it) => a + it.cantidad * it.precio, 0);
  const cantidadCarrito = carrito.reduce((a, it) => a + it.cantidad, 0);

  function puedeEnviarPedido() {
    if (carrito.length === 0) return false;
    if (modoConsumo === 'mesa') return !!pedidoForm.mesa;
    if (modoConsumo === 'delivery') return !!pedidoForm.nombre && !!pedidoForm.telefono && !!pedidoForm.direccion;
    return !!pedidoForm.nombre; // take away
  }

  function descontarStockPorPedido(items) {
    const updates = {};
    items.forEach(it => {
      (it.insumos || []).forEach(ins => {
        const totalUsado = ins.cantidad * it.cantidad;
        if (!totalUsado) return;
        updates['insumos/' + ins.insumoId + '/cantidad'] = firebase.database.ServerValue.increment(-totalUsado);
      });
    });
    if (Object.keys(updates).length > 0) db.ref().update(updates);
  }

  function enviarPedido() {
    if (!puedeEnviarPedido()) return;
    if (modoConsumo !== 'mesa' && !config.whatsapp) return;
    setEnviandoPedido(true);

    const pedidoData = {
      modo: modoConsumo,
      mesa: pedidoForm.mesa || null,
      nombre: pedidoForm.nombre || null,
      telefono: pedidoForm.telefono || null,
      direccion: pedidoForm.direccion || null,
      items: carrito,
      total: totalCarrito,
      estado: 'nuevo',
      creado: Date.now()
    };

    db.ref('pedidos').push().set(pedidoData).then(() => {
      descontarStockPorPedido(carrito);
      if (modoConsumo === 'mesa') {
        setConfirmacionPedido(`¡Pedido enviado a la Mesa ${pedidoForm.mesa}! Ya lo estamos preparando.`);
        setCarrito([]);
        setEnviandoPedido(false);
      } else {
        const lineas = [];
        lineas.push(`Nuevo pedido - ${NOMBRE_NEGOCIO}`);
        if (modoConsumo === 'takeaway') lineas.push(`Modo: Take away - ${pedidoForm.nombre}`);
        if (modoConsumo === 'delivery') {
          lineas.push(`Modo: Delivery`);
          lineas.push(`Cliente: ${pedidoForm.nombre}`);
          lineas.push(`Teléfono: ${pedidoForm.telefono}`);
          lineas.push(`Dirección: ${pedidoForm.direccion}`);
        }
        lineas.push('-------------------------');
        carrito.forEach(it => lineas.push(`${it.cantidad}x ${it.nombre} - $${it.cantidad * it.precio}`));
        lineas.push('-------------------------');
        lineas.push(`Total: $${totalCarrito}`);
        const mensaje = encodeURIComponent(lineas.join('\n'));
        window.open(`https://wa.me/${config.whatsapp}?text=${mensaje}`, '_blank');
        setCarrito([]);
        setPedidoForm({ nombre: '', telefono: '', direccion: '', mesa: mesaPorQR || '' });
        setMostrarCarrito(false);
        setEnviandoPedido(false);
      }
    }).catch(() => setEnviandoPedido(false));
  }
  function cerrarConfirmacionPedido() {
    setConfirmacionPedido(null);
    setPedidoForm({ nombre: '', telefono: '', direccion: '', mesa: mesaPorQR || '' });
    setMostrarCarrito(false);
  }

  const ESTADOS_PEDIDO = ['nuevo', 'recibido', 'entregado', 'cobrado'];
  const ESTADO_LABEL = { nuevo: 'Nuevo pedido', recibido: 'Recibido', entregado: 'Entregado', cobrado: 'Cobrado' };
  const ESTADO_ESTILO = {
    nuevo: 'bg-sky-100 text-sky-700',
    recibido: 'bg-bronce-200 text-cafe-800',
    entregado: 'bg-orange-100 text-orange-700',
    cobrado: 'bg-green-100 text-green-700'
  };
  const listaPedidos = Object.entries(pedidos).map(([id, p]) => ({ id, ...p })).sort((a,b) => (b.creado||0) - (a.creado||0));

  function esHoy(ts) {
    if (!ts) return false;
    return new Date(ts).toDateString() === new Date().toDateString();
  }
  const pedidosHoy = listaPedidos.filter(p => esHoy(p.creado));
  const pedidosCobradosHoy = pedidosHoy.filter(p => p.estado === 'cobrado');
  const pedidosAbiertosHoy = pedidosHoy.filter(p => p.estado !== 'cobrado');
  const totalFacturadoHoy = pedidosCobradosHoy.reduce((a, p) => a + (p.total || 0), 0);
  const totalPorCobrarHoy = pedidosAbiertosHoy.reduce((a, p) => a + (p.total || 0), 0);
  const desglosePorModo = { mesa: 0, takeaway: 0, delivery: 0 };
  pedidosCobradosHoy.forEach(p => { desglosePorModo[p.modo] = (desglosePorModo[p.modo] || 0) + (p.total || 0); });

  function avanzarEstadoPedido(id, estadoActual) {
    const idx = ESTADOS_PEDIDO.indexOf(estadoActual);
    if (idx === -1 || idx === ESTADOS_PEDIDO.length - 1) return;
    db.ref('pedidos/' + id + '/estado').set(ESTADOS_PEDIDO[idx + 1]);
  }
  function horaCorta(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }
  function etiquetaOrigenPedido(p) {
    if (p.modo === 'mesa') return `Mesa ${p.mesa}`;
    if (p.modo === 'takeaway') return `Take away - ${p.nombre}`;
    return `Delivery - ${p.nombre}`;
  }

  const listaMesas = Object.entries(mesas).map(([id, m]) => ({ id, ...m })).sort((a,b) => Number(a.numero) - Number(b.numero));

  function agregarMesa() {
    if (!nuevaMesaNumero) return;
    if (listaMesas.some(m => m.numero === nuevaMesaNumero)) { alert('Ya existe una mesa con ese número.'); return; }
    db.ref('mesas').push().set({ numero: nuevaMesaNumero }).then(() => setNuevaMesaNumero(''));
  }
  function eliminarMesa(id) {
    if (confirm('¿Eliminar esta mesa y su QR?')) db.ref('mesas/' + id).remove();
  }
  function linkMesa(numero) {
    return `${window.location.origin}${window.location.pathname}?mesa=${numero}`;
  }
  function qrMesa(numero) {
    return `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(linkMesa(numero))}`;
  }

  function guardarPlatoDelDia() {
    if (!platoForm.nombre || !platoForm.precio) return;
    db.ref('platoDelDia').set({
      nombre: platoForm.nombre,
      descripcion: platoForm.descripcion || '',
      precio: Number(platoForm.precio),
      imagen: platoForm.imagen || '',
      insumos: platoForm.insumos || [],
      fecha: Date.now()
    });
  }
  function quitarPlatoDelDia() {
    if (confirm('¿Quitar el plato del día de la pantalla principal?')) {
      db.ref('platoDelDia').remove();
      setPlatoForm({ nombre: '', descripcion: '', precio: '', imagen: '', insumos: [] });
    }
  }
  function agregarInsumoAPlato() {
    if (!selInsumoPlato || !cantInsumoPlato) return;
    setPlatoForm(f => ({ ...f, insumos: [...(f.insumos || []), { insumoId: selInsumoPlato, cantidad: Number(cantInsumoPlato) }] }));
    setSelInsumoPlato(''); setCantInsumoPlato('');
  }
  function quitarInsumoDePlato(idx) {
    setPlatoForm(f => ({ ...f, insumos: f.insumos.filter((_, i) => i !== idx) }));
  }
  function handleImagenPlato(e) {
    const file = e.target.files[0];
    if (!file) return;
    resizeImagen(file, dataUrl => setPlatoForm(f => ({ ...f, imagen: dataUrl })));
    e.target.value = '';
  }

  const listaInsumos = Object.entries(insumos).map(([id, i]) => ({ id, ...i }));

  function resetInsumoForm() {
    setInsumoForm({ nombre: '', unidad: '', cantidad: '', minimo: '' });
    setEditandoInsumoId(null);
  }
  function editarInsumo(i) {
    setInsumoForm({ nombre: i.nombre, unidad: i.unidad || '', cantidad: String(i.cantidad ?? ''), minimo: String(i.minimo ?? '') });
    setEditandoInsumoId(i.id);
  }
  function guardarInsumo() {
    if (!insumoForm.nombre) return;
    const id = editandoInsumoId || db.ref('insumos').push().key;

                      <input value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} placeholder="Nombre del plato/bebida" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <select value={form.categoria} onChange={e => setForm({...form, categoria: e.target.value})} className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-white">
                        <option value="">Elegir categoría...</option>
                        {categorias.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                      {categorias.length === 0 && <p className="text-xs text-vino-600">Primero cargá una categoría en la pestaña "Categorías".</p>}
                      <textarea value={form.descripcion} onChange={e => setForm({...form, descripcion: e.target.value})} placeholder="Descripción breve" rows="2" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm"></textarea>
                      <input value={form.precio} onChange={e => setForm({...form, precio: e.target.value})} type="number" placeholder="Precio" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <div className="flex items-center gap-3">
                        <label className="flex-shrink-0 bg-cafe-100 text-cafe-700 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                          <i className="fa-solid fa-camera mr-1.5"></i>Foto
                          <input type="file" accept="image/*" onChange={handleImagenProducto} className="hidden" />
                        </label>
                        {form.imagen && <img src={form.imagen} className="w-12 h-12 rounded-lg object-cover" />}
                      </div>

                      <div className="border-t border-cafe-100 pt-2">
                        <p className="text-xs font-bold text-cafe-500 mb-1.5">Insumos que consume (para descontar stock)</p>
                        {(form.insumos || []).length > 0 && (
                          <div className="space-y-1 mb-2">
                            {form.insumos.map((ins, idx) => (
                              <div key={idx} className="flex items-center justify-between bg-cafe-50 rounded-lg px-2 py-1 text-xs">
                                <span>{insumos[ins.insumoId]?.nombre || '(insumo eliminado)'} — {ins.cantidad} {insumos[ins.insumoId]?.unidad || ''}</span>
                                <button onClick={() => quitarInsumoDeProducto(idx)} className="text-vino-600"><i className="fa-solid fa-xmark"></i></button>
                              </div>
                            ))}
                          </div>
                        )}
                        {listaInsumos.length === 0 ? (
                          <p className="text-[11px] text-cafe-400">Cargá insumos primero en la pestaña "Stock".</p>
                        ) : (
                          <div className="flex gap-1.5">
                            <select value={selInsumoProd} onChange={e => setSelInsumoProd(e.target.value)} className="flex-1 border border-cafe-200 rounded-lg p-2 text-xs bg-white">
                              <option value="">Insumo...</option>
                              {listaInsumos.map(i => <option key={i.id} value={i.id}>{i.nombre}</option>)}
                            </select>
                            <input value={cantInsumoProd} onChange={e => setCantInsumoProd(e.target.value)} type="number" placeholder="Cant." className="w-16 border border-cafe-200 rounded-lg p-2 text-xs" />
                            <button onClick={agregarInsumoAProducto} className="bg-cafe-900 text-bronce-300 px-3 rounded-lg text-xs font-bold">+</button>
                          </div>
                        )}
                      </div>

                      <div className="flex gap-2">
                        <button onClick={guardarProducto} className="flex-1 bg-cafe-900 text-bronce-300 py-2 rounded-xl text-xs font-bold">{editandoId ? 'Guardar cambios' : 'Agregar al menú'}</button>
                        {editandoId && <button onClick={resetForm} className="px-4 bg-cafe-100 rounded-xl text-xs font-bold">Cancelar</button>}
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      {listaProductos.length === 0 && <p className="text-cafe-400 text-xs text-center py-4">Todavía no cargaste ítems.</p>}
                      {listaProductos.map(p => (
                        <div key={p.id} className="flex items-center gap-2.5 border border-cafe-100 bg-white p-2 rounded-xl text-xs">
                          <div className="w-9 h-9 rounded-lg bg-cafe-100 flex-shrink-0 overflow-hidden">{p.imagen && <img src={p.imagen} className="w-full h-full object-cover" />}</div>
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-cafe-800 truncate">{p.nombre}</p>
                            <p className="text-cafe-400">{p.categoria} · ${p.precio}</p>
                          </div>
                          <button onClick={() => editarProducto(p)} className="text-cafe-500 px-1.5"><i className="fa-solid fa-pen"></i></button>
                          <button onClick={() => eliminarProducto(p.id)} className="text-vino-600 px-1.5"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'platodeldia' && (
                  <div className="space-y-3">
                    <p className="text-xs text-cafe-500">Se muestra destacado arriba de todo en la pantalla principal. Actualizalo cada día.</p>
                    <input value={platoForm.nombre} onChange={e => setPlatoForm({...platoForm, nombre: e.target.value})} placeholder="Nombre del plato" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    <textarea value={platoForm.descripcion} onChange={e => setPlatoForm({...platoForm, descripcion: e.target.value})} placeholder="Descripción breve" rows="2" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm"></textarea>
                    <input value={platoForm.precio} onChange={e => setPlatoForm({...platoForm, precio: e.target.value})} type="number" placeholder="Precio" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    <div className="flex items-center gap-3">
                      <label className="flex-shrink-0 bg-cafe-100 text-cafe-700 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                        <i className="fa-solid fa-camera mr-1.5"></i>Foto
                        <input type="file" accept="image/*" onChange={handleImagenPlato} className="hidden" />
                      </label>
                      {platoForm.imagen && <img src={platoForm.imagen} className="w-12 h-12 rounded-full object-cover" />}
                    </div>

                    <div className="border-t border-cafe-100 pt-2">
                      <p className="text-xs font-bold text-cafe-500 mb-1.5">Insumos que consume (para descontar stock)</p>
                      {(platoForm.insumos || []).length > 0 && (
                        <div className="space-y-1 mb-2">
                          {platoForm.insumos.map((ins, idx) => (
                            <div key={idx} className="flex items-center justify-between bg-cafe-50 rounded-lg px-2 py-1 text-xs">
                              <span>{insumos[ins.insumoId]?.nombre || '(insumo eliminado)'} — {ins.cantidad} {insumos[ins.insumoId]?.unidad || ''}</span>
                              <button onClick={() => quitarInsumoDePlato(idx)} className="text-vino-600"><i className="fa-solid fa-xmark"></i></button>
                            </div>
                          ))}
                        </div>
                      )}
                      {listaInsumos.length === 0 ? (
                        <p className="text-[11px] text-cafe-400">Cargá insumos primero en la pestaña "Stock".</p>
                      ) : (
                        <div className="flex gap-1.5">
                          <select value={selInsumoPlato} onChange={e => setSelInsumoPlato(e.target.value)} className="flex-1 border border-cafe-200 rounded-lg p-2 text-xs bg-white">
                            <option value="">Insumo...</option>
                            {listaInsumos.map(i => <option key={i.id} value={i.id}>{i.nombre}</option>)}
                          </select>
                          <input value={cantInsumoPlato} onChange={e => setCantInsumoPlato(e.target.value)} type="number" placeholder="Cant." className="w-16 border border-cafe-200 rounded-lg p-2 text-xs" />
                          <button onClick={agregarInsumoAPlato} className="bg-cafe-900 text-bronce-300 px-3 rounded-lg text-xs font-bold">+</button>
                        </div>
                      )}
                    </div>

                    <div className="flex gap-2">
                      <button onClick={guardarPlatoDelDia} className="flex-1 bg-vino-600 text-white py-2 rounded-xl text-xs font-bold">Publicar plato del día</button>
                      {platoDelDia && <button onClick={quitarPlatoDelDia} className="px-4 bg-cafe-100 rounded-xl text-xs font-bold">Quitar</button>}
                    </div>
                  </div>
                )}

                {adminTab === 'stock' && (
                  <div className="space-y-4">
                    <div className="border border-cafe-200 rounded-xl p-3 space-y-2 bg-white">
                      <h4 className="font-bold text-xs uppercase tracking-wider text-cafe-400">{editandoInsumoId ? 'Editar insumo' : 'Nuevo insumo'}</h4>
                      <input value={insumoForm.nombre} onChange={e => setInsumoForm({...insumoForm, nombre: e.target.value})} placeholder="Ej: Carne picada, Pan, Coca cola 1.5L" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <div className="flex gap-2">
                        <input value={insumoForm.unidad} onChange={e => setInsumoForm({...insumoForm, unidad: e.target.value})} placeholder="Unidad (kg, l, unidad...)" className="flex-1 border border-cafe-200 rounded-xl p-2.5 text-sm" />
                        <input value={insumoForm.cantidad} onChange={e => setInsumoForm({...insumoForm, cantidad: e.target.value})} type="number" placeholder="Stock actual" className="flex-1 border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      </div>
                      <input value={insumoForm.minimo} onChange={e => setInsumoForm({...insumoForm, minimo: e.target.value})} type="number" placeholder="Aviso de stock bajo cuando llegue a..." className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <div className="flex gap-2">
                        <button onClick={guardarInsumo} className="flex-1 bg-cafe-900 text-bronce-300 py-2 rounded-xl text-xs font-bold">{editandoInsumoId ? 'Guardar cambios' : 'Agregar insumo'}</button>
                        {editandoInsumoId && <button onClick={resetInsumoForm} className="px-4 bg-cafe-100 rounded-xl text-xs font-bold">Cancelar</button>}
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      {listaInsumos.length === 0 && <p className="text-cafe-400 text-xs text-center py-4">Todavía no cargaste insumos.</p>}
                      {listaInsumos.map(i => {
                        const bajoStock = i.minimo > 0 && Number(i.cantidad) <= Number(i.minimo);
                        return (
                          <div key={i.id} className={`flex items-center gap-2.5 border p-2.5 rounded-xl text-xs ${bajoStock ? 'border-vino-300 bg-vino-500/5' : 'border-cafe-100 bg-white'}`}>
                            <div className="flex-1 min-w-0">
                              <p className="font-bold text-cafe-800 truncate">{i.nombre}</p>
                              <p className={bajoStock ? 'text-vino-600 font-bold' : 'text-cafe-400'}>
                                {i.cantidad} {i.unidad} en stock{bajoStock && ' · ¡bajo stock!'}
                              </p>
                            </div>
                            <button onClick={() => editarInsumo(i)} className="text-cafe-500 px-1.5"><i className="fa-solid fa-pen"></i></button>
                            <button onClick={() => eliminarInsumo(i.id)} className="text-vino-600 px-1.5"><i className="fa-solid fa-trash-can"></i></button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {adminTab === 'mesas' && (
                  <div className="space-y-4">
                    <p className="text-xs text-cafe-500">Cargá el número de cada mesa. Se genera un QR que, al escanearlo, abre el menú identificado con esa mesa — y el pedido llega marcado con el número.</p>
                    <div className="flex gap-2">
                      <input value={nuevaMesaNumero} onChange={e => setNuevaMesaNumero(e.target.value)} placeholder="Ej: 4" className="flex-1 border border-cafe-200 rounded-xl p-2.5 text-sm" onKeyDown={e => e.key==='Enter' && agregarMesa()} />
                      <button onClick={agregarMesa} className="bg-cafe-900 text-bronce-300 px-4 rounded-xl text-sm font-bold">Agregar</button>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      {listaMesas.length === 0 && <p className="text-cafe-400 text-xs col-span-2">Todavía no cargaste mesas.</p>}
                      {listaMesas.map(m => (
                        <div key={m.id} className="bg-white border border-cafe-100 rounded-xl p-3 flex flex-col items-center gap-2">
                          <p className="font-heading font-bold text-cafe-900">Mesa {m.numero}</p>
                          <a href={qrMesa(m.numero)} target="_blank" rel="noreferrer">
                            <img src={qrMesa(m.numero)} className="w-32 h-32 rounded-lg border border-cafe-100" alt={`QR mesa ${m.numero}`} />
                          </a>
                          <p className="text-[10px] text-cafe-400 text-center">Tocá el QR para verlo grande y guardarlo</p>
                          <button onClick={() => eliminarMesa(m.id)} className="text-vino-600 text-xs font-bold"><i className="fa-solid fa-trash-can mr-1"></i>Eliminar</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'categorias' && (
                  <div className="space-y-4">
                    <div className="flex gap-2">
                      <input value={nuevaCategoria} onChange={e => setNuevaCategoria(e.target.value)} placeholder="Ej: Desayunos, Parrilla, Bebidas..." className="flex-1 border border-cafe-200 rounded-xl p-2.5 text-sm" onKeyDown={e => e.key==='Enter' && agregarCategoria()} />
                      <button onClick={agregarCategoria} className="bg-cafe-900 text-bronce-300 px-4 rounded-xl text-sm font-bold">Agregar</button>
                    </div>
                    <div className="space-y-1.5">
                      {categorias.length === 0 && <p className="text-cafe-400 text-xs">Todavía no cargaste categorías.</p>}
                      {categorias.map(c => (
                        <div key={c} className="flex justify-between items-center border border-cafe-100 bg-white p-2.5 rounded-xl text-sm">
                          <span className="text-cafe-800 font-medium">{c}</span>
                          <button onClick={() => eliminarCategoria(c)} className="text-vino-600"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'config' && (
                  <div className="space-y-3">
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Logo</label>
                      <div className="flex items-center gap-3">
                        {config.logo && <img src={config.logo} className="w-12 h-12 rounded-full object-cover" />}
                        <label className="bg-cafe-100 text-cafe-700 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                          Subir logo<input type="file" accept="image/*" onChange={handleLogo} className="hidden" />
                        </label>
                      </div>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">WhatsApp (solo números, con código de país)</label>
                      <input value={whatsappInput} onChange={e => setWhatsappInput(e.target.value)} placeholder="5491122334455" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Instagram (usuario, sin @)</label>
                      <input value={instagramInput} onChange={e => setInstagramInput(e.target.value)} placeholder="elargentino" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Dirección</label>
                      <input value={direccionInput} onChange={e => setDireccionInput(e.target.value)} placeholder="Calle 48 2085, ..." className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    </div>
                    <button onClick={guardarConfig} className="w-full bg-cafe-900 text-bronce-300 py-2.5 rounded-xl text-sm font-bold">Guardar configuración</button>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
