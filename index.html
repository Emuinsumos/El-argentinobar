<script type="text/babel">
const { useState, useEffect, useRef } = React;
const NOMBRE_NEGOCIO = "El Argentino";
const TAGLINE = "Café · Desayuno · Almuerzo · Parrilla";

// Credenciales de admin — cambiar acá cuando quieras
const ADMIN_USUARIO = "ElArgentino";
const ADMIN_CONTRASENA = "tango2024";

function resizeImagen(file, callback, maxSize = 900) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
      else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function App() {
  const [productos, setProductos] = useState({});
  const [categorias, setCategorias] = useState([]);
  const [config, setConfig] = useState({ whatsapp: '', instagram: '', logo: '', direccion: '' });

  const [categoriaActiva, setCategoriaActiva] = useState('todas');
  const [busqueda, setBusqueda] = useState('');

  const [isAdmin, setIsAdmin] = useState(false);
  const [mostrarAdminModal, setMostrarAdminModal] = useState(false);
  const [adminTab, setAdminTab] = useState('productos');
  const [usuario, setUsuario] = useState('');
  const [contrasena, setContrasena] = useState('');
  const [errorLogin, setErrorLogin] = useState('');

  const [form, setForm] = useState({ nombre: '', categoria: '', descripcion: '', precio: '', imagen: '' });
  const [editandoId, setEditandoId] = useState(null);

  const [nuevaCategoria, setNuevaCategoria] = useState('');

  const [whatsappInput, setWhatsappInput] = useState('');
  const [instagramInput, setInstagramInput] = useState('');
  const [direccionInput, setDireccionInput] = useState('');

  const [platoDelDia, setPlatoDelDia] = useState(null);
  const [platoForm, setPlatoForm] = useState({ nombre: '', descripcion: '', precio: '', imagen: '' });

  const [carrito, setCarrito] = useState([]);
  const [mostrarCarrito, setMostrarCarrito] = useState(false);
  const [modoConsumo, setModoConsumo] = useState('mesa');
  const [pedidoForm, setPedidoForm] = useState({ nombre: '', telefono: '', direccion: '', mesa: '' });
  const [enviandoPedido, setEnviandoPedido] = useState(false);

  const [mesas, setMesas] = useState({});
  const [nuevaMesaNumero, setNuevaMesaNumero] = useState('');
  const [mesaPorQR, setMesaPorQR] = useState(null);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const mesaUrl = params.get('mesa');
    if (mesaUrl) {
      setMesaPorQR(mesaUrl);
      setModoConsumo('mesa');
      setPedidoForm(f => ({ ...f, mesa: mesaUrl }));
    }
  }, []);

  useEffect(() => {
    db.ref('productos').on('value', s => setProductos(s.val() || {}));
    db.ref('categorias').on('value', s => setCategorias(s.val() || []));
    db.ref('config').on('value', s => {
      const c = s.val() || {};
      setConfig(c);
      setWhatsappInput(c.whatsapp || '');
      setInstagramInput(c.instagram || '');
      setDireccionInput(c.direccion || '');
    });
    db.ref('platoDelDia').on('value', s => {
      const p = s.val();
      setPlatoDelDia(p);
      if (p) setPlatoForm({ nombre: p.nombre || '', descripcion: p.descripcion || '', precio: p.precio ? String(p.precio) : '', imagen: p.imagen || '' });
    });
    db.ref('mesas').on('value', s => setMesas(s.val() || {}));
  }, []);

  const listaProductos = Object.entries(productos).map(([id, p]) => ({ id, ...p }));

  const productosFiltrados = listaProductos.filter(p => {
    const pasaCategoria = categoriaActiva === 'todas' || p.categoria === categoriaActiva;
    const pasaBusqueda = !busqueda || p.nombre.toLowerCase().includes(busqueda.toLowerCase());
    return pasaCategoria && pasaBusqueda;
  });

  const categoriasConProductos = categorias.filter(c => listaProductos.some(p => p.categoria === c));

  function intentarLogin() {
    if (usuario === ADMIN_USUARIO && contrasena === ADMIN_CONTRASENA) {
      setIsAdmin(true);
      setErrorLogin('');
      setUsuario(''); setContrasena('');
    } else {
      setErrorLogin('Usuario o contraseña incorrectos');
    }
  }
  function cerrarSesion() {
    setIsAdmin(false);
    setMostrarAdminModal(false);
  }

  function resetForm() {
    setForm({ nombre: '', categoria: categorias[0] || '', descripcion: '', precio: '', imagen: '' });
    setEditandoId(null);
  }
  function editarProducto(p) {
    setForm({ nombre: p.nombre, categoria: p.categoria, descripcion: p.descripcion || '', precio: String(p.precio), imagen: p.imagen || '' });
    setEditandoId(p.id);
    setAdminTab('productos');
  }
  function guardarProducto() {
    if (!form.nombre || !form.categoria || !form.precio) return;
    const id = editandoId || db.ref('productos').push().key;
    db.ref('productos/' + id).set({
      nombre: form.nombre,
      categoria: form.categoria,
      descripcion: form.descripcion || '',
      precio: Number(form.precio),
      imagen: form.imagen || ''
    });
    resetForm();
  }
  function eliminarProducto(id) {
    if (confirm('¿Eliminar este ítem del menú?')) db.ref('productos/' + id).remove();
  }
  function handleImagenProducto(e) {
    const file = e.target.files[0];
    if (!file) return;
    resizeImagen(file, dataUrl => setForm(f => ({ ...f, imagen: dataUrl })));
    e.target.value = '';
  }

  function agregarCategoria() {
    if (!nuevaCategoria || categorias.includes(nuevaCategoria)) return;
    db.ref('categorias').set([...categorias, nuevaCategoria]).then(() => setNuevaCategoria(''));
  }
  function eliminarCategoria(cat) {
    if (listaProductos.some(p => p.categoria === cat)) {
      alert('Esta categoría tiene ítems del menú cargados. Cambiá o eliminá esos ítems antes de borrarla.');
      return;
    }
    db.ref('categorias').set(categorias.filter(c => c !== cat));
  }

  function agregarAlCarrito(p) {
    setCarrito(prev => {
      const existe = prev.find(it => it.id === p.id);
      if (existe) return prev.map(it => it.id === p.id ? { ...it, cantidad: it.cantidad + 1 } : it);
      return [...prev, { id: p.id, nombre: p.nombre, precio: p.precio, cantidad: 1 }];
    });
  }
  function cambiarCantidadCarrito(id, delta) {
    setCarrito(prev => prev
      .map(it => it.id === id ? { ...it, cantidad: it.cantidad + delta } : it)
      .filter(it => it.cantidad > 0));
  }
  const totalCarrito = carrito.reduce((a, it) => a + it.cantidad * it.precio, 0);
  const cantidadCarrito = carrito.reduce((a, it) => a + it.cantidad, 0);

  function puedeEnviarPedido() {
    if (carrito.length === 0) return false;
    if (modoConsumo === 'mesa') return !!pedidoForm.mesa;
    if (modoConsumo === 'delivery') return !!pedidoForm.nombre && !!pedidoForm.telefono && !!pedidoForm.direccion;
    return !!pedidoForm.nombre; // take away
  }

  function enviarPedido() {
    if (!puedeEnviarPedido() || !config.whatsapp) return;
    setEnviandoPedido(true);
    const lineas = [];
    lineas.push(`🍽️ *Nuevo pedido - ${NOMBRE_NEGOCIO}*`);
    if (modoConsumo === 'mesa') lineas.push(`Modo: Mesa (${pedidoForm.mesa})`);
    if (modoConsumo === 'takeaway') lineas.push(`Modo: Take away — ${pedidoForm.nombre}`);
    if (modoConsumo === 'delivery') {
      lineas.push(`Modo: Delivery`);
      lineas.push(`Cliente: ${pedidoForm.nombre}`);
      lineas.push(`Teléfono: ${pedidoForm.telefono}`);
      lineas.push(`Dirección: ${pedidoForm.direccion}`);
    }
    lineas.push('-------------------------');
    carrito.forEach(it => lineas.push(`${it.cantidad}x ${it.nombre} — $${it.cantidad * it.precio}`));
    lineas.push('-------------------------');
    lineas.push(`*Total: $${totalCarrito}*`);

    db.ref('pedidos').push().set({
      modo: modoConsumo,
      mesa: pedidoForm.mesa || null,
      nombre: pedidoForm.nombre || null,
      telefono: pedidoForm.telefono || null,
      direccion: pedidoForm.direccion || null,
      items: carrito,
      total: totalCarrito,
      estado: 'recibido',
      creado: Date.now()
    }).then(() => {
      const mensaje = encodeURIComponent(lineas.join('\n'));
      window.open(`https://wa.me/${config.whatsapp}?text=${mensaje}`, '_blank');
      setCarrito([]);
      setPedidoForm({ nombre: '', telefono: '', direccion: '', mesa: '' });
      setMostrarCarrito(false);
      setEnviandoPedido(false);
    }).catch(() => setEnviandoPedido(false));
  }

  const listaMesas = Object.entries(mesas).map(([id, m]) => ({ id, ...m })).sort((a,b) => Number(a.numero) - Number(b.numero));

  function agregarMesa() {
    if (!nuevaMesaNumero) return;
    if (listaMesas.some(m => m.numero === nuevaMesaNumero)) { alert('Ya existe una mesa con ese número.'); return; }
    db.ref('mesas').push().set({ numero: nuevaMesaNumero }).then(() => setNuevaMesaNumero(''));
  }
  function eliminarMesa(id) {
    if (confirm('¿Eliminar esta mesa y su QR?')) db.ref('mesas/' + id).remove();
  }
  function linkMesa(numero) {
    return `${window.location.origin}${window.location.pathname}?mesa=${numero}`;
  }
  function qrMesa(numero) {
    return `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(linkMesa(numero))}`;
  }

  function guardarPlatoDelDia() {
    if (!platoForm.nombre || !platoForm.precio) return;
    db.ref('platoDelDia').set({
      nombre: platoForm.nombre,
      descripcion: platoForm.descripcion || '',
      precio: Number(platoForm.precio),
      imagen: platoForm.imagen || '',
      fecha: Date.now()
    });
  }
  function quitarPlatoDelDia() {
    if (confirm('¿Quitar el plato del día de la pantalla principal?')) {
      db.ref('platoDelDia').remove();
      setPlatoForm({ nombre: '', descripcion: '', precio: '', imagen: '' });
    }
  }
  function handleImagenPlato(e) {
    const file = e.target.files[0];
    if (!file) return;
    resizeImagen(file, dataUrl => setPlatoForm(f => ({ ...f, imagen: dataUrl })));
    e.target.value = '';
  }

  function guardarConfig() {
    db.ref('config').set({ ...config, whatsapp: whatsappInput, instagram: instagramInput, direccion: direccionInput });
  }
  function handleLogo(e) {
    const file = e.target.files[0];
    if (!file) return;
    resizeImagen(file, dataUrl => {
      db.ref('config').set({ ...config, whatsapp: whatsappInput, instagram: instagramInput, direccion: direccionInput, logo: dataUrl });
    }, 300);
  }

  return (
    <div className="pb-16">

      {/* ===================== HEADER ===================== */}
      <header className="bg-cafe-900 text-cafe-50 relative overflow-hidden">
        <div className="absolute inset-0 opacity-[0.06]" style={{backgroundImage: 'repeating-linear-gradient(45deg, #B8863B 0px, #B8863B 1px, transparent 1px, transparent 14px)'}}></div>
        <div className="max-w-4xl mx-auto px-5 py-7 relative">
          <div className="flex items-start justify-between gap-4">
            <div className="flex items-center gap-3">
              {config.logo && <img src={config.logo} className="w-14 h-14 rounded-full object-cover border-2 border-bronce-500" />}
              <div>
                <h1 className="font-heading text-3xl sm:text-4xl font-bold tracking-tight text-bronce-400">{NOMBRE_NEGOCIO}</h1>
                <p className="text-cafe-200 text-sm tracking-wide mt-0.5">{TAGLINE}</p>
              </div>
            </div>
            <div className="flex gap-2 flex-shrink-0">
              {config.whatsapp && (
                <a href={`https://wa.me/${config.whatsapp}`} target="_blank" className="btn-red btn-whatsapp"><i className="fa-brands fa-whatsapp"></i></a>
              )}
              {config.instagram && (
                <a href={`https://instagram.com/${config.instagram}`} target="_blank" className="btn-red btn-instagram"><i className="fa-brands fa-instagram"></i></a>
              )}
            </div>
          </div>
        </div>
        <div className="h-1 w-full bg-gradient-to-r from-bronce-600 via-bronce-400 to-bronce-600"></div>
      </header>

      {/* ===================== AVISO MESA POR QR ===================== */}
      {mesaPorQR && (
        <div className="bg-bronce-500 text-cafe-900 text-center text-sm font-bold py-1.5">
          <i className="fa-solid fa-chair mr-1.5"></i>Pedido para la Mesa {mesaPorQR}
        </div>
      )}

      {/* ===================== PLATO DEL DÍA ===================== */}
      {platoDelDia && (
        <div className="bg-vino-600 text-cafe-50 relative overflow-hidden">
          <div className="max-w-4xl mx-auto px-5 py-4 flex items-center gap-4">
            {platoDelDia.imagen && (
              <img src={platoDelDia.imagen} className="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover border-2 border-bronce-300 flex-shrink-0" />
            )}
            <div className="min-w-0 flex-1">
              <p className="text-[11px] uppercase tracking-widest text-bronce-300 font-semibold">Plato del día</p>
              <h2 className="font-heading text-lg sm:text-xl font-bold leading-tight truncate">{platoDelDia.nombre}</h2>
              {platoDelDia.descripcion && <p className="text-cafe-100 text-sm leading-snug line-clamp-1">{platoDelDia.descripcion}</p>}
            </div>
            <p className="font-heading text-xl sm:text-2xl font-bold text-bronce-300 flex-shrink-0">${platoDelDia.precio}</p>
          </div>
        </div>
      )}

      {/* ===================== BUSCADOR + CATEGORÍAS ===================== */}
      <div className="max-w-4xl mx-auto px-5 mt-6">
        <div className="relative">
          <i className="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-cafe-400"></i>
          <input
            value={busqueda}
            onChange={e => setBusqueda(e.target.value)}
            placeholder="Buscar en el menú..."
            className="w-full bg-white filete-borde rounded-full py-2.5 pl-11 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-bronce-400"
          />
        </div>

        <div className="flex gap-2 overflow-x-auto no-scrollbar mt-4 pb-1">
          <button
            onClick={() => setCategoriaActiva('todas')}
            className={`flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-medium border transition ${categoriaActiva === 'todas' ? 'bg-cafe-900 text-bronce-300 border-cafe-900' : 'bg-white text-cafe-700 border-cafe-200'}`}>
            Todo
          </button>
          {categoriasConProductos.map(c => (
            <button
              key={c}
              onClick={() => setCategoriaActiva(c)}
              className={`flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-medium border transition ${categoriaActiva === c ? 'bg-cafe-900 text-bronce-300 border-cafe-900' : 'bg-white text-cafe-700 border-cafe-200'}`}>
              {c}
            </button>
          ))}
        </div>
      </div>

      {/* ===================== MENÚ ===================== */}
      <div className="max-w-4xl mx-auto px-5 mt-6">
        {productosFiltrados.length === 0 && (
          <div className="text-center py-16 text-cafe-400">
            <i className="fa-solid fa-utensils text-3xl mb-3"></i>
            <p>{listaProductos.length === 0 ? 'Todavía no hay ítems cargados en el menú.' : 'No encontramos nada con ese filtro.'}</p>
          </div>
        )}
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          {productosFiltrados.map(p => (
            <div key={p.id} className="bg-white rounded-lg filete-borde overflow-hidden flex animate-fade-in">
              <div className="w-28 h-28 flex-shrink-0 bg-cafe-100">
                {p.imagen ? <img src={p.imagen} className="w-full h-full object-cover" /> : (
                  <div className="w-full h-full flex items-center justify-center text-cafe-300"><i className="fa-solid fa-utensils text-2xl"></i></div>
                )}
              </div>
              <div className="p-3 flex flex-col justify-between flex-1 min-w-0">
                <div>
                  <h3 className="font-heading font-bold text-cafe-900 leading-tight">{p.nombre}</h3>
                  {p.descripcion && <p className="text-xs text-cafe-500 mt-1 leading-snug line-clamp-2">{p.descripcion}</p>}
                </div>
                <div className="flex items-center justify-between mt-1">
                  <p className="font-heading font-bold text-vino-600">${p.precio}</p>
                  <button onClick={() => agregarAlCarrito(p)} className="w-8 h-8 rounded-full bg-cafe-900 text-bronce-300 flex items-center justify-center hover:bg-cafe-800 transition flex-shrink-0" title="Agregar al pedido">
                    <i className="fa-solid fa-plus text-xs"></i>
                  </button>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* ===================== FOOTER ===================== */}
      <footer className="max-w-4xl mx-auto px-5 mt-10 text-center text-xs text-cafe-400">
        {config.direccion && <p className="mb-1"><i className="fa-solid fa-location-dot mr-1"></i>{config.direccion}</p>}
        <p>{NOMBRE_NEGOCIO} — {TAGLINE}</p>
      </footer>

      {/* ===================== BOTÓN ADMIN ===================== */}
      <button
        onClick={() => setMostrarAdminModal(true)}
        className="fixed bottom-5 left-5 z-40 bg-cafe-900 text-bronce-400 w-11 h-11 rounded-full flex items-center justify-center shadow-xl hover:scale-105 transition"
        title="Administración">
        <i className="fa-solid fa-gear"></i>
      </button>

      {/* ===================== BOTÓN CARRITO ===================== */}
      {carrito.length > 0 && (
        <button
          onClick={() => setMostrarCarrito(true)}
          className="fixed bottom-5 right-5 z-40 bg-vino-600 text-white pl-4 pr-5 h-12 rounded-full flex items-center gap-2.5 shadow-2xl hover:scale-105 transition">
          <span className="relative">
            <i className="fa-solid fa-receipt"></i>
            <span className="absolute -top-2 -right-2.5 bg-bronce-500 text-cafe-900 text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">{cantidadCarrito}</span>
          </span>
          <span className="font-heading font-bold text-sm">${totalCarrito}</span>
        </button>
      )}

      {/* ===================== MODAL CARRITO / PEDIDO ===================== */}
      {mostrarCarrito && (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-cafe-50 w-full sm:max-w-md sm:rounded-2xl rounded-t-3xl max-h-[92vh] overflow-y-auto animate-slide-up">
            <div className="sticky top-0 bg-cafe-900 text-bronce-300 px-5 py-3.5 flex justify-between items-center">
              <h3 className="font-heading font-bold">Tu pedido</h3>
              <button onClick={() => setMostrarCarrito(false)} className="text-bronce-300/80 hover:text-bronce-300"><i className="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div className="p-4 space-y-4">
              <div className="space-y-2">
                {carrito.length === 0 && <p className="text-cafe-400 text-sm text-center py-4">Todavía no agregaste nada.</p>}
                {carrito.map(it => (
                  <div key={it.id} className="flex items-center gap-2.5 bg-white border border-cafe-100 rounded-xl p-2.5">
                    <div className="flex-1 min-w-0">
                      <p className="font-bold text-sm text-cafe-800 truncate">{it.nombre}</p>
                      <p className="text-xs text-cafe-400">${it.precio} c/u</p>
                    </div>
                    <button onClick={() => cambiarCantidadCarrito(it.id, -1)} className="w-7 h-7 rounded-full bg-cafe-100 text-cafe-700 flex items-center justify-center"><i className="fa-solid fa-minus text-xs"></i></button>
                    <span className="w-5 text-center font-bold text-sm">{it.cantidad}</span>
                    <button onClick={() => cambiarCantidadCarrito(it.id, 1)} className="w-7 h-7 rounded-full bg-cafe-900 text-bronce-300 flex items-center justify-center"><i className="fa-solid fa-plus text-xs"></i></button>
                  </div>
                ))}
              </div>

              {carrito.length > 0 && (
                <>
                  <div className="flex justify-between items-center border-t border-cafe-200 pt-3">
                    <span className="font-heading font-bold text-cafe-900">Total</span>
                    <span className="font-heading font-bold text-vino-600 text-xl">${totalCarrito}</span>
                  </div>

                  <div>
                    <p className="text-xs font-bold text-cafe-600 mb-1.5">¿Cómo lo vas a consumir?</p>
                    {mesaPorQR ? (
                      <div className="bg-cafe-900 text-bronce-300 rounded-xl py-2.5 text-center text-sm font-bold">
                        <i className="fa-solid fa-chair mr-1.5"></i>Mesa {mesaPorQR}
                      </div>
                    ) : (
                      <div className="grid grid-cols-3 gap-2">
                        {[['mesa','En el lugar'],['takeaway','Take away'],['delivery','Delivery']].map(([id,label]) => (
                          <button key={id} onClick={() => setModoConsumo(id)} className={`py-2 rounded-xl text-xs font-bold border ${modoConsumo===id ? 'bg-cafe-900 text-bronce-300 border-cafe-900' : 'bg-white text-cafe-600 border-cafe-200'}`}>{label}</button>
                        ))}
                      </div>
                    )}
                  </div>

                  {modoConsumo === 'mesa' && !mesaPorQR && (
                    <input value={pedidoForm.mesa} onChange={e => setPedidoForm({...pedidoForm, mesa: e.target.value})} placeholder="Número de mesa" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                  )}
                  {modoConsumo === 'takeaway' && (
                    <input value={pedidoForm.nombre} onChange={e => setPedidoForm({...pedidoForm, nombre: e.target.value})} placeholder="Tu nombre" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                  )}
                  {modoConsumo === 'delivery' && (
                    <div className="space-y-2">
                      <input value={pedidoForm.nombre} onChange={e => setPedidoForm({...pedidoForm, nombre: e.target.value})} placeholder="Tu nombre" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <input value={pedidoForm.telefono} onChange={e => setPedidoForm({...pedidoForm, telefono: e.target.value})} placeholder="Teléfono" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <input value={pedidoForm.direccion} onChange={e => setPedidoForm({...pedidoForm, direccion: e.target.value})} placeholder="Dirección de entrega" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    </div>
                  )}

                  {!config.whatsapp && <p className="text-vino-600 text-xs">Falta cargar el WhatsApp del local en Configuración.</p>}

                  <button
                    onClick={enviarPedido}
                    disabled={!puedeEnviarPedido() || !config.whatsapp || enviandoPedido}
                    className="w-full bg-[#25D366] disabled:opacity-40 text-white py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2">
                    <i className="fa-brands fa-whatsapp"></i>{enviandoPedido ? 'Enviando...' : 'Enviar pedido por WhatsApp'}
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ===================== MODAL ADMIN ===================== */}
      {mostrarAdminModal && (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-cafe-50 w-full sm:max-w-2xl sm:rounded-2xl rounded-t-3xl max-h-[92vh] overflow-y-auto animate-slide-up">
            <div className="sticky top-0 bg-cafe-900 text-bronce-300 px-5 py-3.5 flex justify-between items-center">
              <h3 className="font-heading font-bold">{isAdmin ? 'Administración' : 'Ingresar'}</h3>
              <button onClick={() => setMostrarAdminModal(false)} className="text-bronce-300/80 hover:text-bronce-300"><i className="fa-solid fa-xmark text-lg"></i></button>
            </div>

            {!isAdmin ? (
              <div className="p-6 space-y-3">
                <input value={usuario} onChange={e => setUsuario(e.target.value)} placeholder="Usuario" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                <input value={contrasena} onChange={e => setContrasena(e.target.value)} type="password" placeholder="Contraseña" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" onKeyDown={e => e.key === 'Enter' && intentarLogin()} />
                {errorLogin && <p className="text-vino-600 text-xs">{errorLogin}</p>}
                <button onClick={intentarLogin} className="w-full bg-cafe-900 text-bronce-300 py-2.5 rounded-xl text-sm font-bold hover:bg-cafe-800">Entrar</button>
              </div>
            ) : (
              <div className="p-4">
                <div className="flex gap-1.5 mb-4 overflow-x-auto no-scrollbar">
                  {[['productos','Menú'],['platodeldia','Plato del día'],['mesas','Mesas'],['categorias','Categorías'],['config','Configuración']].map(([id,label]) => (
                    <button key={id} onClick={() => setAdminTab(id)} className={`flex-shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold ${adminTab===id ? 'bg-cafe-900 text-bronce-300' : 'bg-cafe-100 text-cafe-600'}`}>{label}</button>
                  ))}
                  <button onClick={cerrarSesion} className="ml-auto flex-shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold bg-vino-600 text-white">Salir</button>
                </div>

                {adminTab === 'productos' && (
                  <div className="space-y-4">
                    <div className="border border-cafe-200 rounded-xl p-3 space-y-2 bg-white">
                      <h4 className="font-bold text-xs uppercase tracking-wider text-cafe-400">{editandoId ? 'Editar ítem' : 'Nuevo ítem del menú'}</h4>
                      <input value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} placeholder="Nombre del plato/bebida" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <select value={form.categoria} onChange={e => setForm({...form, categoria: e.target.value})} className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-white">
                        <option value="">Elegir categoría...</option>
                        {categorias.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                      {categorias.length === 0 && <p className="text-xs text-vino-600">Primero cargá una categoría en la pestaña "Categorías".</p>}
                      <textarea value={form.descripcion} onChange={e => setForm({...form, descripcion: e.target.value})} placeholder="Descripción breve" rows="2" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm"></textarea>
                      <input value={form.precio} onChange={e => setForm({...form, precio: e.target.value})} type="number" placeholder="Precio" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <div className="flex items-center gap-3">
                        <label className="flex-shrink-0 bg-cafe-100 text-cafe-700 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                          <i className="fa-solid fa-camera mr-1.5"></i>Foto
                          <input type="file" accept="image/*" onChange={handleImagenProducto} className="hidden" />
                        </label>
                        {form.imagen && <img src={form.imagen} className="w-12 h-12 rounded-lg object-cover" />}
                      </div>
                      <div className="flex gap-2">
                        <button onClick={guardarProducto} className="flex-1 bg-cafe-900 text-bronce-300 py-2 rounded-xl text-xs font-bold">{editandoId ? 'Guardar cambios' : 'Agregar al menú'}</button>
                        {editandoId && <button onClick={resetForm} className="px-4 bg-cafe-100 rounded-xl text-xs font-bold">Cancelar</button>}
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      {listaProductos.length === 0 && <p className="text-cafe-400 text-xs text-center py-4">Todavía no cargaste ítems.</p>}
                      {listaProductos.map(p => (
                        <div key={p.id} className="flex items-center gap-2.5 border border-cafe-100 bg-white p-2 rounded-xl text-xs">
                          <div className="w-9 h-9 rounded-lg bg-cafe-100 flex-shrink-0 overflow-hidden">{p.imagen && <img src={p.imagen} className="w-full h-full object-cover" />}</div>
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-cafe-800 truncate">{p.nombre}</p>
                            <p className="text-cafe-400">{p.categoria} · ${p.precio}</p>
                          </div>
                          <button onClick={() => editarProducto(p)} className="text-cafe-500 px-1.5"><i className="fa-solid fa-pen"></i></button>
                          <button onClick={() => eliminarProducto(p.id)} className="text-vino-600 px-1.5"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'platodeldia' && (
                  <div className="space-y-3">
                    <p className="text-xs text-cafe-500">Se muestra destacado arriba de todo en la pantalla principal. Actualizalo cada día.</p>
                    <input value={platoForm.nombre} onChange={e => setPlatoForm({...platoForm, nombre: e.target.value})} placeholder="Nombre del plato" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    <textarea value={platoForm.descripcion} onChange={e => setPlatoForm({...platoForm, descripcion: e.target.value})} placeholder="Descripción breve" rows="2" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm"></textarea>
                    <input value={platoForm.precio} onChange={e => setPlatoForm({...platoForm, precio: e.target.value})} type="number" placeholder="Precio" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    <div className="flex items-center gap-3">
                      <label className="flex-shrink-0 bg-cafe-100 text-cafe-700 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                        <i className="fa-solid fa-camera mr-1.5"></i>Foto
                        <input type="file" accept="image/*" onChange={handleImagenPlato} className="hidden" />
                      </label>
                      {platoForm.imagen && <img src={platoForm.imagen} className="w-12 h-12 rounded-full object-cover" />}
                    </div>
                    <div className="flex gap-2">
                      <button onClick={guardarPlatoDelDia} className="flex-1 bg-vino-600 text-white py-2 rounded-xl text-xs font-bold">Publicar plato del día</button>
                      {platoDelDia && <button onClick={quitarPlatoDelDia} className="px-4 bg-cafe-100 rounded-xl text-xs font-bold">Quitar</button>}
                    </div>
                  </div>
                )}

                {adminTab === 'mesas' && (
                  <div className="space-y-4">
                    <p className="text-xs text-cafe-500">Cargá el número de cada mesa. Se genera un QR que, al escanearlo, abre el menú identificado con esa mesa — y el pedido llega marcado con el número.</p>
                    <div className="flex gap-2">
                      <input value={nuevaMesaNumero} onChange={e => setNuevaMesaNumero(e.target.value)} placeholder="Ej: 4" className="flex-1 border border-cafe-200 rounded-xl p-2.5 text-sm" onKeyDown={e => e.key==='Enter' && agregarMesa()} />
                      <button onClick={agregarMesa} className="bg-cafe-900 text-bronce-300 px-4 rounded-xl text-sm font-bold">Agregar</button>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      {listaMesas.length === 0 && <p className="text-cafe-400 text-xs col-span-2">Todavía no cargaste mesas.</p>}
                      {listaMesas.map(m => (
                        <div key={m.id} className="bg-white border border-cafe-100 rounded-xl p-3 flex flex-col items-center gap-2">
                          <p className="font-heading font-bold text-cafe-900">Mesa {m.numero}</p>
                          <a href={qrMesa(m.numero)} target="_blank" rel="noreferrer">
                            <img src={qrMesa(m.numero)} className="w-32 h-32 rounded-lg border border-cafe-100" alt={`QR mesa ${m.numero}`} />
                          </a>
                          <p className="text-[10px] text-cafe-400 text-center">Tocá el QR para verlo grande y guardarlo</p>
                          <button onClick={() => eliminarMesa(m.id)} className="text-vino-600 text-xs font-bold"><i className="fa-solid fa-trash-can mr-1"></i>Eliminar</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'categorias' && (
                  <div className="space-y-4">
                    <div className="flex gap-2">
                      <input value={nuevaCategoria} onChange={e => setNuevaCategoria(e.target.value)} placeholder="Ej: Desayunos, Parrilla, Bebidas..." className="flex-1 border border-cafe-200 rounded-xl p-2.5 text-sm" onKeyDown={e => e.key==='Enter' && agregarCategoria()} />
                      <button onClick={agregarCategoria} className="bg-cafe-900 text-bronce-300 px-4 rounded-xl text-sm font-bold">Agregar</button>
                    </div>
                    <div className="space-y-1.5">
                      {categorias.length === 0 && <p className="text-cafe-400 text-xs">Todavía no cargaste categorías.</p>}
                      {categorias.map(c => (
                        <div key={c} className="flex justify-between items-center border border-cafe-100 bg-white p-2.5 rounded-xl text-sm">
                          <span className="text-cafe-800 font-medium">{c}</span>
                          <button onClick={() => eliminarCategoria(c)} className="text-vino-600"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'config' && (
                  <div className="space-y-3">
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Logo</label>
                      <div className="flex items-center gap-3">
                        {config.logo && <img src={config.logo} className="w-12 h-12 rounded-full object-cover" />}
                        <label className="bg-cafe-100 text-cafe-700 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                          Subir logo<input type="file" accept="image/*" onChange={handleLogo} className="hidden" />
                        </label>
                      </div>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">WhatsApp (solo números, con código de país)</label>
                      <input value={whatsappInput} onChange={e => setWhatsappInput(e.target.value)} placeholder="5491122334455" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Instagram (usuario, sin @)</label>
                      <input value={instagramInput} onChange={e => setInstagramInput(e.target.value)} placeholder="elargentino" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Dirección</label>
                      <input value={direccionInput} onChange={e => setDireccionInput(e.target.value)} placeholder="Calle 48 2085, ..." className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    </div>
                    <button onClick={guardarConfig} className="w-full bg-cafe-900 text-bronce-300 py-2.5 rounded-xl text-sm font-bold">Guardar configuración</button>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
